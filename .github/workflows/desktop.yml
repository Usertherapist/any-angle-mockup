name: Build macOS app

# Every push to main (the same push that deploys Vercel) builds a new DMG
# and publishes it as a GitHub Release. It can also be started by hand.
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', '.vercelignore']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Report start
        run: |
          mkdir -p /tmp/pub && cd /tmp/pub
          git init -q -b desktop-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "status=started version=$VERSION commit=$GITHUB_SHA run=$GITHUB_RUN_ID" > BUILD.txt
          git add -A && git commit -q -m "Desktop build $VERSION started"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" desktop-build

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build universal app and DMG
        working-directory: desktop
        run: |
          npx tauri build --target universal-apple-darwin --config "{\"version\":\"$VERSION\"}" 2>&1 | tee build.log

      - name: Collect DMG
        id: dmg
        run: |
          src=$(ls desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          mkdir -p out
          cp "$src" "out/Any-Angle-Mockup-$VERSION.dmg"
          echo "file=out/Any-Angle-Mockup-$VERSION.dmg" >> "$GITHUB_OUTPUT"
          ls -la out

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "${{ steps.dmg.outputs.file }}" \
            --title "Any Angle Mockup $VERSION" \
            --notes "macOS app (Apple Silicon and Intel), built from ${GITHUB_SHA::7}. First launch: right-click the app and choose Open, or allow it in System Settings → Privacy & Security." \
            --latest

      # Keeps the newest build (or the failure log) on a single-commit branch,
      # so it can be fetched with plain git.
      - name: Publish to desktop-build branch
        if: always()
        run: |
          mkdir -p pub && cd pub
          git init -q -b desktop-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if ls ../out/*.dmg >/dev/null 2>&1; then
            cp ../out/*.dmg .
            echo "status=success version=$VERSION commit=$GITHUB_SHA run=$GITHUB_RUN_ID" > BUILD.txt
          else
            echo "status=failed version=$VERSION commit=$GITHUB_SHA run=$GITHUB_RUN_ID" > BUILD.txt
          fi
          [ -f ../desktop/build.log ] && tail -n 400 ../desktop/build.log > build.log || true
          git add -A && git commit -q -m "Desktop build $VERSION"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" desktop-build
